# JVM for the Gradle daemon. Kotlin + Compose compilation of this module needs
# noticeably more than the 1 GB default; CI no longer has to override it.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.caching=true
org.gradle.parallel=true

# Configuration cache stays OFF on purpose. The release signing config
# materialises .github/ci-keystore.jks.b64 into .gradle/ during configuration; a
# configuration-cache hit skips that and the packaging task would then sign
# against a file that is not there. Re-enable this only together with moving
# the keystore decode into a proper task.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# Keep unit-test tasks available for all build types.
android.onlyEnableUnitTestForTheTestedBuildType=false

kotlin.code.style=official
