distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# AGP 9.4 raises the minimum Gradle to 9.6.0, so this had to move off 9.5.x.
# 9.7.1 is the newest actual Gradle release and the recommended patch of the
# 9.7 line. It is deliberately NOT 9.8.0-M1/M2: those are development
# milestones of an unreleased version that no AGP is tested against, whereas
# 9.7.x is a released line that AGP 9.4 alphas are built on top of.
#
# Moving here is what forced the provider-API change in app/build.gradle.kts:
# Gradle 9.6 deprecated resolving project properties through the project
# hierarchy and removes it in Gradle 10.
#
# CI reads this version out of this file, so the pipeline moves with the wrapper.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
