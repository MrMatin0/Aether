distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 9.5.1 is the recommended patch of the 9.5 line (fixes an OOM when upgrading
# onto 9.5.0, and a Tooling API failure with relative project directories).
# Staying on 9.5.x is deliberate: it is the minimum AND the maximum Gradle that
# both AGP 9.3 and the Kotlin 2.4.x toolchain are fully tested against, and
# Gradle 9.6+ deprecates the implicit parent-project property lookup that
# `project.findProperty("githubRepo")` in app/build.gradle.kts relies on.
# CI reads this version out of this file, so it moves with the wrapper.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
