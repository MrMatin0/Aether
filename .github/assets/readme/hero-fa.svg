<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
<title id="t">Aether+</title>
<desc id="d">عبور هوشمند از محدودیت‌های اینترنت</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060918"/><stop offset=".55" stop-color="#110a2b"/><stop offset="1" stop-color="#071a2c"/></linearGradient>
<radialGradient id="a1"><stop offset="0" stop-color="#7c3aed" stop-opacity=".62"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<radialGradient id="a2"><stop offset="0" stop-color="#06b6d4" stop-opacity=".45"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
<radialGradient id="a3"><stop offset="0" stop-color="#ec4899" stop-opacity=".38"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#f5d0fe"/>
<animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="8s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="orb" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#a78bfa"/><stop offset=".55" stop-color="#6d28d9"/><stop offset="1" stop-color="#0e7490"/></radialGradient>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
<clipPath id="clip"><rect width="1280" height="440" rx="28"/></clipPath>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>.e{font-family:'Segoe UI',Inter,system-ui,-apple-system,Roboto,Arial,sans-serif}.f{font-family:Vazirmatn,Vazir,Tahoma,'Segoe UI',sans-serif}
.b1{animation:m1 16s ease-in-out infinite alternate}
.b2{animation:m2 19s ease-in-out infinite alternate}
.b3{animation:m3 13s ease-in-out infinite alternate}
@keyframes m1{to{transform:translate(160px,50px)}}
@keyframes m2{to{transform:translate(-180px,-40px)}}
@keyframes m3{to{transform:translate(90px,-60px)}}
.tw{animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 3.6s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:.85}100%{transform:scale(2.1);opacity:0}}
.fade{animation:up 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.breath{transform-box:fill-box;transform-origin:center;animation:br 3.6s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#clip)">
<rect width="1280" height="440" fill="url(#bg)"/>
<rect width="1280" height="440" fill="url(#grid)"/>
<circle class="b1" cx="170" cy="120" r="330" fill="url(#a1)"/>
<circle class="b2" cx="470" cy="360" r="300" fill="url(#a2)"/>
<circle class="b3" cx="640" cy="-40" r="260" fill="url(#a3)"/>
<circle cx="80" cy="60" r="1.2" fill="#fff" class="tw" style="animation-delay:0s"/><circle cx="210" cy="380" r="1.6" fill="#fff" class="tw" style="animation-delay:.8s"/><circle cx="420" cy="90" r="1" fill="#fff" class="tw" style="animation-delay:.4s"/><circle cx="640" cy="40" r="1.4" fill="#fff" class="tw" style="animation-delay:1.6s"/><circle cx="760" cy="400" r="1.1" fill="#fff" class="tw" style="animation-delay:2.2s"/><circle cx="900" cy="70" r="1.7" fill="#fff" class="tw" style="animation-delay:.2s"/><circle cx="1080" cy="30" r="1.2" fill="#fff" class="tw" style="animation-delay:1.1s"/><circle cx="1220" cy="380" r="1.5" fill="#fff" class="tw" style="animation-delay:2.6s"/><circle cx="560" cy="300" r="1" fill="#fff" class="tw" style="animation-delay:1.9s"/><circle cx="1180" cy="200" r="1.2" fill="#fff" class="tw" style="animation-delay:.6s"/><circle cx="40" cy="250" r="1.4" fill="#fff" class="tw" style="animation-delay:2.9s"/><circle cx="700" cy="220" r="1" fill="#fff" class="tw" style="animation-delay:3.3s"/>
<g>
<circle cx="290" cy="220" r="160" fill="none" stroke="#a78bfa" stroke-opacity=".18" stroke-dasharray="2 10"><animateTransform attributeName="transform" type="rotate" from="0 290 220" to="360 290 220" dur="40s" repeatCount="indefinite"/></circle>
<g><animateTransform attributeName="transform" type="rotate" from="0 290 220" to="360 290 220" dur="14s" repeatCount="indefinite"/>
<circle cx="290" cy="220" r="118" fill="none" stroke="#67e8f9" stroke-opacity=".28" stroke-dasharray="60 14"/>
<circle cx="408" cy="220" r="6" fill="#67e8f9" filter="url(#glow)"/></g>
<g><animateTransform attributeName="transform" type="rotate" from="360 290 220" to="0 290 220" dur="22s" repeatCount="indefinite"/>
<circle cx="290" cy="60" r="5" fill="#f0abfc" filter="url(#glow)"/></g>
<circle class="ring" cx="290" cy="220" r="74" fill="none" stroke="#a78bfa" stroke-width="2"/>
<circle class="ring" cx="290" cy="220" r="74" fill="none" stroke="#67e8f9" stroke-width="2" style="animation-delay:1.2s"/>
<circle class="ring" cx="290" cy="220" r="74" fill="none" stroke="#f0abfc" stroke-width="2" style="animation-delay:2.4s"/>
<g class="breath"><circle cx="290" cy="220" r="78" fill="url(#orb)" filter="url(#glow)"/>
<circle cx="290" cy="220" r="78" fill="none" stroke="#fff" stroke-opacity=".25"/>
<path d="M290 186v30" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
<path d="M268 197a32 32 0 1 0 44 0" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/></g>
</g>
<g class="fade"><rect x="798" y="62" width="372" height="36" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/>
<circle cx="820" cy="80" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
<text class="e" x="994" y="86" font-size="15" font-weight="600" letter-spacing=".6" fill="#cbd5e1" text-anchor="middle">Android 8+  ·  Open Source  ·  AGPL-3.0</text></g>
<text class="fade e" style="animation-delay:.12s" x="1170" y="210" font-size="112" font-weight="800" letter-spacing="-2" fill="url(#tg)" text-anchor="end">Aether+</text>
<text class="fade f" style="animation-delay:.26s" x="1170" y="272" font-size="36" font-weight="700" fill="#f1f5f9" direction="rtl" text-anchor="start">عبور هوشمند از محدودیت‌های اینترنت</text>
<text class="fade f" style="animation-delay:.4s" x="1170" y="314" font-size="21" fill="#94a3b8" direction="rtl" text-anchor="start">کشف خودکار مسیر، تونل رمزگذاری‌شده و زنجیرهٔ هسته‌ها</text>
<g class="fade" style="animation-delay:.55s"><rect x="1066" y="352" width="104" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#a78bfa" stroke-opacity=".55"/><circle cx="1086" cy="372" r="5" fill="#a78bfa" class="tw" style="animation-delay:.0s"/><text class="e" x="1126" y="378.5" font-size="17" font-weight="600" fill="#e5e7eb" text-anchor="middle">Aether</text></g><g class="fade" style="animation-delay:.67s"><rect x="930" y="352" width="124" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#67e8f9" stroke-opacity=".55"/><circle cx="950" cy="372" r="5" fill="#67e8f9" class="tw" style="animation-delay:.4s"/><text class="e" x="1000" y="378.5" font-size="17" font-weight="600" fill="#e5e7eb" text-anchor="middle">Psiphon</text></g><g class="fade" style="animation-delay:.79s"><rect x="846" y="352" width="72" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#f0abfc" stroke-opacity=".55"/><circle cx="866" cy="372" r="5" fill="#f0abfc" class="tw" style="animation-delay:.8s"/><text class="e" x="890" y="378.5" font-size="17" font-weight="600" fill="#e5e7eb" text-anchor="middle">Tor</text></g><g class="fade" style="animation-delay:.91s"><rect x="750" y="352" width="84" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#fcd34d" stroke-opacity=".55"/><circle cx="770" cy="372" r="5" fill="#fcd34d" class="tw" style="animation-delay:1.2s"/><text class="e" x="800" y="378.5" font-size="17" font-weight="600" fill="#e5e7eb" text-anchor="middle">Xray</text></g>
<rect width="1280" height="440" rx="28" fill="none" stroke="#fff" stroke-opacity=".08"/>
</g>
</svg>
