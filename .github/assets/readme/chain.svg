<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-label="Android, Xray, Aether, Psiphon, Tor, Internet">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#0d1430"/></linearGradient>
<filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>.e{font-family:'Segoe UI',Inter,system-ui,-apple-system,Roboto,Arial,sans-serif}.f{font-family:Vazirmatn,Vazir,Tahoma,'Segoe UI',sans-serif}
