name: Apply release-only build trigger

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Restrict Build workflow to release tags
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/build.yml')
          text = workflow.read_text()
          start = text.index('on:\n')
          end = text.index('\n# Read-only by default.', start)
          replacement = '''on:
            push:
              tags: ["v*"]
          '''
          workflow.write_text(text[:start] + replacement + text[end:])
          Path('.github/workflows/patch-build-trigger.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: run builds only for release tags"
          git push origin HEAD:main
