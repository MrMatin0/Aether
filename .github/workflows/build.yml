name: Build

# ---------------------------------------------------------------------------
# One pipeline, three jobs, one direction of travel:
#
#   natives  ->  app  ->  release
#
# Design rules this file follows:
#
#  1. A BUILD NEVER WRITES TO THE REPOSITORY. No auto-commits, no auto-push, no
#     keystore minted and pushed back, no README rewritten mid-run. CI reads the
#     tree, produces artifacts, and stops. Anything that has to change the repo
#     goes through a pull request instead (see core-sync.yml). The checkouts
#     below therefore run with persist-credentials: false - the build scripts
#     clone third-party sources, and none of them has any business inheriting a
#     token from .git/config.
#  2. A BUILD IS REPRODUCIBLE. The engine version is whatever the tree says it
#     is, the Gradle version is whatever the wrapper descriptor says it is, and
#     cargo-ndk is pinned. Nothing is silently upgraded while a release is being
#     cut, so the APK attached to a tag is the APK that tag's source produces.
#  3. NATIVE WORK IS CACHED - BUT ONLY WHEN IT IS COMPLETE. The NDK/Rust half
#     takes minutes and depends only on scripts/ and native/, so it is keyed on
#     exactly that. What it must never do is cache a PARTIAL payload: see the
#     natives job for why that used to remove the chain feature from every
#     later release permanently.
#  4. ONLY TAGS BECOME "LATEST". A push to the default branch publishes a
#     PRERELEASE so every build stays downloadable, but `make_latest` is
#     reserved for `v*` tags. That is what stops a dispatch from an old feature
#     branch (see v1.3.0-build.48) from advertising itself as the current
#     download while main is already on 1.4.5.
#  5. ONE MISSING CORE COSTS EXACTLY THAT CORE. Psiphon and Tor are built as two
#     independent steps, never as one `all` invocation: the script is set -e, so
#     a Go hiccup used to cost libtor.so too - and tor is just a signed download
#     that had nothing to do with the failure.
#  6. EVERY JOB HAS A CEILING. Without timeout-minutes a hung sdkmanager, cargo
#     or `go build` sits on a runner for the six-hour default.
#  7. A RELEASE MAY NOT SHIP WITHOUT THE CORES IT ADVERTISES. Rules 3 and 5 make
#     a missing chain core survivable; for months they also made it INVISIBLE.
#     The Psiphon core could not build at all (GO_VERSION was six releases older
#     than psiphon-tunnel-core's go.mod), the step is continue-on-error, and the
#     only trace was a ::warning:: in a green log - so every published APK told
#     users "this build does not include the Psiphon core". A missing core is now
#     a warning on a branch push or a pull request and a HARD FAILURE on a `v*`
#     tag, checked twice: after the natives job builds, and against the contents
#     of the assembled APKs. The same rule covers Psiphon's bootstrap server
#     list: a core with nowhere to start dialling advertises a mode that cannot
#     connect, which is the failure this rule exists to prevent.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    # NOTE: deliberately NO paths filter on push. GitHub evaluates path filters
    # against the pushed commits, and a tag push carries no file changes of its
    # own - a filter here can silently skip the release a `v*` tag exists to cut.
  # A pull request is a VERIFICATION run: it compiles, tests, checks the
  # signature and the native payload, then attaches the APKs to the run so a
  # change can be installed on a real device before it is merged. It publishes
  # nothing and cannot write to the repo (see the permissions below).
  pull_request:
    branches: [main, master]
    # Prose cannot change an APK, and a cold run is ~20 minutes of runner time.
    # Everything that CAN reach the build - sources, scripts, native/, gradle/,
    # this file - is deliberately absent from this list.
    paths-ignore:
      - "README.md"
      - "README.fa.md"
      - "docs/**"
      - "_META/**"
      - "LICENSE"
  workflow_dispatch:

# Read-only by default. Only the release job widens this.
permissions:
  contents: read

# Never let two runs of the same ref race each other.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "17"            # AGP 9.4 requires JDK 17
  NDK_VERSION: "26.3.11579264"
  ANDROID_API: "26"             # must match minSdk in app/build.gradle.kts
  RUST_TARGETS: "aarch64-linux-android,armv7-linux-androideabi"
  # Psiphon core (cgo through the NDK). THIS VALUE IS LOAD-BEARING:
  # psiphon-tunnel-core's staging-client go.mod carries `go 1.26.0` and
  # `toolchain go1.26.5`, and actions/setup-go exports GOTOOLCHAIN=local whenever
  # a go-version is requested, so Go REFUSES to fetch a newer toolchain and stops
  # with "go.mod requires go >= 1.26.0" before compiling a single package. This
  # was pinned to 1.23, the step is continue-on-error, and the result was that no
  # release ever shipped libpsiphon.so. The Psiphon step additionally runs with
  # GOTOOLCHAIN=auto so the next upstream bump costs a toolchain download rather
  # than the whole feature; scripts/build-overlay-cores.sh reads the requirement
  # out of upstream's go.mod and fails with the fix in the message.
  GO_VERSION: "1.26"
  # Pinned on purpose. `cargo install cargo-ndk` unpinned means the toolchain
  # that links a release is whatever crates.io published that morning, which is
  # rule 2 above with extra steps.
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  # =========================================================== NATIVE CORES ==
  natives:
    name: Native cores
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The .so files depend on the build scripts, the JNI bridge and the
      # vendored engine - nothing else in this repository. Key the cache on
      # exactly those and an app-only commit reuses them instead of spending
      # ~8 minutes setting up and running the NDK and Rust toolchains.
      #
      # RESTORE ONLY. The save is a separate, GUARDED step at the end of this
      # job, and that split is the whole point:
      #
      #   actions/cache saves whenever the job succeeds, and the overlay-core
      #   steps below are continue-on-error by design. So the first run in which
      #   Psiphon or Tor failed to build wrote an INCOMPLETE jniLibs under this
      #   key - and since a cache hit used to skip every build step, every later
      #   run restored that incomplete payload and never retried. One transient
      #   Go or upstream-layout hiccup silently removed the chain feature from
      #   every subsequent release. Key bumped to v4 with the Go fix, so no entry
      #   written by a build that could not compile Psiphon is inherited.
      - name: Restore prebuilt native cores
        id: natives-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/assets/tor
          key: >-
            jnilibs-v4-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-api${{ env.ANDROID_API }}-go${{
            env.GO_VERSION }}-${{
            hashFiles('scripts/build-natives.sh', 'scripts/fetch-natives.sh',
            'scripts/build-overlay-cores.sh', 'scripts/aethertun-jni.c',
            'native/aether/**') }}

      # A restored cache is trusted only for what it actually contains. Anything
      # missing is rebuilt, so a cache that lost the chain cores costs one slow
      # job instead of costing the feature forever.
      #
      # psiphon and tor are reported SEPARATELY rather than as one `chain` flag:
      # they come from two unrelated toolchains (a Go cross-compile and a signed
      # AAR download), so there is no reason a missing one should drag the other
      # into a rebuild - or be blocked by it failing.
      - name: Decide what still has to be built
        id: payload
        run: |
          set -euo pipefail
          mandatory=true
          psiphon=true
          tor=true
          for abi in arm64-v8a armeabi-v7a; do
            for lib in libaether.so libhev-socks5-tunnel.so libaethertun.so; do
              [ -f "app/src/main/jniLibs/${abi}/${lib}" ] || mandatory=false
            done
            [ -f "app/src/main/jniLibs/${abi}/libpsiphon.so" ] || psiphon=false
            [ -f "app/src/main/jniLibs/${abi}/libtor.so" ] || tor=false
          done
          chain=false
          if [ "${psiphon}" = true ] && [ "${tor}" = true ]; then chain=true; fi
          build=true
          if [ "${mandatory}" = true ] && [ "${chain}" = true ]; then build=false; fi
          {
            echo "mandatory=${mandatory}"
            echo "psiphon=${psiphon}"
            echo "tor=${tor}"
            echo "chain=${chain}"
            echo "build=${build}"
          } >> "$GITHUB_OUTPUT"
          echo "restored: mandatory=${mandatory} psiphon=${psiphon} tor=${tor} -> build=${build}"

      - name: Set up Android SDK
        if: steps.payload.outputs.build == 'true'
        uses: android-actions/setup-android@v4

      - name: Install NDK ${{ env.NDK_VERSION }}
        if: steps.payload.outputs.build == 'true'
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null
          test -d "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" \
            || { echo "::error::NDK ${NDK_VERSION} not installed"; exit 1; }
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust (Android targets)
        if: steps.payload.outputs.mandatory != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGETS }}

      # cargo-ndk used to be compiled from source on every single run. Cache the
      # binary and the crate registry; the engine pulls in quiche and friends.
      #
      # Only cargo-ndk is cached out of ~/.cargo/bin, never the whole directory:
      # that also holds rustup's cargo/rustc/rustup shims, and restoring last
      # week's shims over the toolchain the action just installed is a debugging
      # session nobody needs. The pin is part of the key, so bumping the version
      # installs the new one instead of finding the old one and stopping.
      - name: Cache cargo registry and cargo-ndk
        if: steps.payload.outputs.mandatory != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-v2-${{ runner.os }}-ndk${{ env.CARGO_NDK_VERSION }}-${{ hashFiles('native/aether/**/Cargo.lock', 'native/aether/**/Cargo.toml') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-ndk${{ env.CARGO_NDK_VERSION }}-

      - name: Install cargo-ndk ${{ env.CARGO_NDK_VERSION }}
        if: steps.payload.outputs.mandatory != 'true'
        run: |
          set -euo pipefail
          have="$(cargo ndk --version 2>/dev/null | awk '{print $NF}' || true)"
          if [ "${have}" = "${CARGO_NDK_VERSION}" ]; then
            echo "cargo-ndk ${have} restored from cache."
            exit 0
          fi
          cargo install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked --force

      - name: Fetch native sources
        if: steps.payload.outputs.mandatory != 'true'
        run: bash scripts/fetch-natives.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AETHER_REPO: CluvexStudio/Aether

      # hev's tunnel core, our own JNI bridge and the Rust engine in one pass.
      # No auto-upgrade and no rollback dance: whatever is vendored in the tree
      # is what gets compiled, so this step either works or it is a real error.
      - name: Build native cores (hev + engine)
        if: steps.payload.outputs.mandatory != 'true'
        run: bash scripts/build-natives.sh all
        env:
          ANDROID_API: ${{ env.ANDROID_API }}

      # ---- OVERLAY CORES (Psiphon + Tor) -----------------------------------
      # Deliberately non-fatal, and deliberately AFTER the mandatory cores.
      #
      # These two are additive: the app detects a build without them and says so
      # (the Chain settings page disables the modes that need them and names the
      # missing core, instead of failing at connect time). A Go toolchain hiccup
      # or an upstream layout change must therefore cost the chain feature for
      # one build - not the whole APK, which is what would happen if this were
      # part of the step above.
      #
      # And it must cost ONE core, not both. `build-overlay-cores.sh all` builds
      # Psiphon first under set -e, so a Go failure returned before tor - a
      # plain signed-AAR download - was ever attempted, and a single flaky Go
      # step took out both chain cores. Two steps, two independent failures,
      # each gated on the core it actually produces.
      #
      # What none of this may cost is a RELEASE: see the verify step below, which
      # turns a missing core into a hard failure on a `v*` tag.
      - name: Set up Go ${{ env.GO_VERSION }}
        if: steps.payload.outputs.psiphon != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # GOTOOLCHAIN=auto is the escape hatch, not the plan. setup-go exports
      # GOTOOLCHAIN=local for the whole job when a go-version is given, which is
      # exactly what made "GO_VERSION is older than psiphon's go.mod" fatal
      # instead of self-correcting. GO_VERSION above is still expected to satisfy
      # upstream on its own; this only stops the next bump from silently removing
      # the feature again.
      - name: Build the Psiphon core
        id: psiphon_core
        if: steps.payload.outputs.psiphon != 'true'
        continue-on-error: true
        run: bash scripts/build-overlay-cores.sh psiphon
        env:
          ANDROID_API: ${{ env.ANDROID_API }}
          GOTOOLCHAIN: auto

      - name: Build the Tor core
        id: tor_core
        if: steps.payload.outputs.tor != 'true'
        continue-on-error: true
        run: bash scripts/build-overlay-cores.sh tor
        env:
          ANDROID_API: ${{ env.ANDROID_API }}

      # Re-inspect AFTER building: this decides what the summary says, whether
      # the payload is allowed into the cache, and - on a tag - whether this is
      # publishable at all.
      - name: Verify the built payload
        id: built
        env:
          IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          PSIPHON_OUTCOME: ${{ steps.psiphon_core.outcome }}
          TOR_OUTCOME: ${{ steps.tor_core.outcome }}
        run: |
          set -euo pipefail
          # `find` on a missing root is fatal under set -e, and "No such file or
          # directory" says nothing about the build step that actually went
          # wrong. Report the real problem instead.
          if [ ! -d app/src/main/jniLibs ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::error::app/src/main/jniLibs does not exist - no native cores were produced or restored"
            exit 1
          fi
          complete=true
          {
            echo "### Native cores"
            echo '```'
            find app/src/main/jniLibs -name '*.so' -printf '%p  %s bytes\n' | sort
            echo '```'
            echo "### Chain cores"
            echo "- Psiphon build step: \`${PSIPHON_OUTCOME:-skipped}\`"
            echo "- Tor build step: \`${TOR_OUTCOME:-skipped}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          for lib in libpsiphon.so libtor.so; do
            present=true
            for abi in arm64-v8a armeabi-v7a; do
              [ -f "app/src/main/jniLibs/${abi}/${lib}" ] || present=false
            done
            if [ "${present}" = true ]; then
              echo "- ${lib}: present" >> "$GITHUB_STEP_SUMMARY"
            else
              complete=false
              echo "- ${lib}: **MISSING** - chain modes needing it are unavailable in this build" \
                >> "$GITHUB_STEP_SUMMARY"
              if [ "${IS_RELEASE_TAG}" = "true" ]; then
                echo "::error::${lib} is missing for at least one ABI. A tagged release must not ship without the chain cores it advertises - fix the build step above and re-tag."
              else
                echo "::warning::${lib} is missing for at least one ABI; the chain modes that need it will be unavailable"
              fi
            fi
          done
          echo "complete=${complete}" >> "$GITHUB_OUTPUT"
          # THE RELEASE GATE. A coreless build stays buildable and installable on
          # a branch - that is rule 5 - but it may not become a release. Before
          # this existed the whole signal was a ::warning:: in a green log, and
          # every published APK told users the Psiphon core was not included.
          if [ "${complete}" != true ] && [ "${IS_RELEASE_TAG}" = "true" ]; then
            echo "::error::refusing to publish a release without the Psiphon and Tor cores"
            exit 1
          fi

      # ONLY a complete payload is cached. An incomplete one would be restored by
      # every later run and skip the build that would have fixed it, which is
      # exactly how the chain cores disappeared from releases.
      #
      # The guard is "something was built AND the result is complete", NOT "the
      # restore missed". Those are not the same: a run that restored a PARTIAL
      # entry (a v2 leftover, or anything written before this guard existed)
      # rebuilt the missing cores and then refused to save the repaired payload,
      # because the restore had technically hit - so every later run restored the
      # same partial entry and paid for the same rebuild, forever. Cache keys are
      # immutable, so a save against an existing key is a logged no-op rather
      # than a failure, which is the right outcome here.
      - name: Save the native cores for later runs
        if: steps.payload.outputs.build == 'true' && steps.built.outputs.complete == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/assets/tor
          key: ${{ steps.natives-cache.outputs.cache-primary-key }}

      - name: Upload native cores
        uses: actions/upload-artifact@v7
        with:
          name: jnilibs
          path: app/src/main/jniLibs
          if-no-files-found: error
          retention-days: 7

      - name: Upload chain assets
        uses: actions/upload-artifact@v7
        with:
          name: chain-assets
          path: app/src/main/assets
          if-no-files-found: ignore
          retention-days: 7

  # =========================================================== RELEASE APKS ==
  app:
    name: Release APKs
    needs: natives
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.collect.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Download native cores
        uses: actions/download-artifact@v8
        with:
          name: jnilibs
          path: app/src/main/jniLibs

      # tor's geoip database. Optional by design: continue-on-error, because a
      # build without it is a valid build with fewer chain features.
      - name: Download chain assets
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: chain-assets
          path: app/src/main/assets

      # THE PSIPHON CONFIG IS WRITTEN HERE, NOT IN THE NATIVES JOB.
      #
      # It used to be written by build-overlay-cores.sh, in a job whose cache
      # covers app/src/main/jniLibs and app/src/main/assets/tor - and NOT
      # app/src/main/assets/psiphon.config. So on any cache hit the config was
      # never produced, never uploaded and never packaged, and the Psiphon modes
      # reported "no Psiphon config" on a repo that had the secret configured.
      # Writing it in the job that actually assembles the APK removes the
      # dependency on a cache entirely.
      #
      # OPTIONAL since Psiphon stopped needing a supplied config at all:
      # PsiphonCore carries its own (see docs/CHAINING.md). This only overrides
      # it, for a deployment that has its own network-issued PropagationChannelId
      # / SponsorId. A repo without the secret builds a fully working APK.
      - name: Bundle the Psiphon client config
        env:
          PSIPHON_CONFIG_B64: ${{ secrets.PSIPHON_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${PSIPHON_CONFIG_B64:-}" ]; then
            echo "::notice::No PSIPHON_CONFIG_B64 secret - Psiphon will use its built-in client config."
            exit 0
          fi
          mkdir -p app/src/main/assets
          printf '%s' "${PSIPHON_CONFIG_B64}" | base64 -d > app/src/main/assets/psiphon.config
          # A mis-pasted secret must fail the build, not ship a config the core
          # will refuse three minutes into a connect attempt.
          python3 -c "import json;json.load(open('app/src/main/assets/psiphon.config'))" \
            || { echo "::error::PSIPHON_CONFIG_B64 did not decode to valid JSON"; exit 1; }
          echo "Bundled a Psiphon client config ($(stat -c%s app/src/main/assets/psiphon.config) bytes)."

      # THE PSIPHON BOOTSTRAP SERVER LIST IS WRITTEN HERE, FOR EXACTLY THE REASON
      # THE CONFIG ABOVE IS.
      #
      # psiphon-tunnel-core is compiled from upstream source, and upstream source
      # contains no servers. Without this list the core has nowhere to start
      # dialling: it comes up, finds zero candidates and burns its whole establish
      # budget saying so in Go - which is exactly what "Psiphon does not work"
      # looked like from the outside.
      #
      # It cannot live in the natives job: that job's cache covers jniLibs and
      # assets/tor only, so on a cache hit its Psiphon step never runs and
      # anything else it would have written into assets/ is never produced, never
      # uploaded and never packaged. This is the job that assembles the APK, so it
      # is the only place the asset can be guaranteed.
      #
      # Rule 7: a warning on a branch, fatal on a `v*` tag. A release may not
      # advertise a Psiphon mode that cannot connect.
      - name: Bundle the Psiphon bootstrap server list
        env:
          PSIPHON_SERVER_LIST_URL: ${{ secrets.PSIPHON_SERVER_LIST_URL }}
          PSIPHON_SERVER_LIST_B64: ${{ secrets.PSIPHON_SERVER_LIST_B64 }}
          IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -uo pipefail
          if bash scripts/fetch-psiphon-serverlist.sh; then
            echo "- Psiphon bootstrap server list: present ($(stat -c%s app/src/main/assets/psiphon/server_entries.txt) bytes)" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${IS_RELEASE_TAG}" = "true" ]; then
            echo "::error::no Psiphon bootstrap server list - a tagged release must not ship a Psiphon mode that cannot connect"
            exit 1
          fi
          echo "::warning::no Psiphon bootstrap server list; the Psiphon chain modes will be unavailable in this build"
          echo "- :warning: Psiphon bootstrap server list **MISSING** - Psiphon modes unavailable" \
            >> "$GITHUB_STEP_SUMMARY"

      # Fail in five seconds instead of six minutes. An APK that ships only some
      # of the cores runs proxy mode and silently fails full VPN mode.
      - name: Check the native payload
        env:
          IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          chain_missing=false
          for abi in arm64-v8a armeabi-v7a; do
            for lib in libaether.so libhev-socks5-tunnel.so libaethertun.so; do
              if [ ! -f "app/src/main/jniLibs/${abi}/${lib}" ]; then
                echo "::error::missing native library ${abi}/${lib}"
                exit 1
              fi
            done
            # The chain cores are OPTIONAL on a branch: the Chain settings page
            # disables the modes that need a missing core and names it, so a
            # missing one is a warning there. On a `v*` tag it is fatal - see
            # rule 7 at the top of this file.
            for lib in libpsiphon.so libtor.so; do
              if [ ! -f "app/src/main/jniLibs/${abi}/${lib}" ]; then
                chain_missing=true
                echo "::warning::${abi}/${lib} is missing - the chain modes that need it will be unavailable in this build"
                echo "- :warning: \`${abi}/${lib}\` missing: chain modes needing it are unavailable" \
                  >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done
          if [ "${chain_missing}" = true ] && [ "${IS_RELEASE_TAG}" = "true" ]; then
            echo "::error::a tagged release must include libpsiphon.so and libtor.so for every ABI"
            exit 1
          fi
          echo "Native payload complete for arm64-v8a and armeabi-v7a."

      # This repo ships no gradle-wrapper.jar, so Gradle comes from the action.
      # AGP accepts only a narrow window of Gradle versions (9.4 needs 9.6.0 or
      # newer) and the runner image's preinstalled Gradle drifts, so the version
      # is read from the wrapper descriptor: one source of truth, no drift, and
      # the pipeline moves when the wrapper does.
      - name: Resolve the required Gradle version
        id: gradle_version
        run: |
          set -euo pipefail
          v="$(sed -n 's#^distributionUrl=.*gradle-\(.*\)-\(bin\|all\)\.zip#\1#p' \
            gradle/wrapper/gradle-wrapper.properties)"
          [ -n "$v" ] || { echo "::error::could not read the Gradle version from the wrapper descriptor"; exit 1; }
          echo "Gradle ${v} (from gradle/wrapper/gradle-wrapper.properties)"
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle_version.outputs.version }}
          # Only the default branch writes the dependency cache; PRs read it.
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      # Removes files that older versions shipped and that a copied-over
      # checkout can leave behind, and hard-fails on any stale string reference.
      # Read-only against the repository: nothing is committed any more.
      - name: Purge stale sources from older versions
        run: bash scripts/purge-stale-sources.sh

      # SIGNING. Always the same certificate, because Android only installs an
      # update when the old and the new APK share a signer.
      #   1. Repository Secrets (use this for real distribution).
      #   2. .github/ci-keystore.jks.b64, the key every release so far was
      #      signed with. Gradle decodes it itself.
      # There is deliberately no third option: CI no longer mints a fresh key,
      # because a build that invents a certificate produces an APK that existing
      # users cannot install over the app they already have.
      #
      # The passwords do NOT go into $GITHUB_ENV any more. A secret written
      # there is exported to every later step in the job - including the ones
      # that run third-party build scripts - and a value containing a newline
      # can define extra variables on the way in. Only the mode and the keystore
      # path (neither of them secret) leave this step; the credentials go
      # straight to the single step that needs them.
      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Signing with the release keystore from repository Secrets."
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            test -s "${RUNNER_TEMP}/release.keystore" \
              || { echo "::error::KEYSTORE_BASE64 decoded to an empty file"; exit 1; }
            {
              echo "mode=release"
              echo "keystore_path=${RUNNER_TEMP}/release.keystore"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f .github/ci-keystore.jks.b64 ]; then
            echo "::warning::No signing Secrets set - using the CI keystore committed to this repo."
            echo "::warning::It is public by definition: it guarantees updatability, not authenticity."
            echo "::warning::Add KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD for real distribution."
            {
              echo "mode=ci"
              echo "keystore_path="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::No signing material found."
          echo "::error::Add the KEYSTORE_* Secrets, or restore .github/ci-keystore.jks.b64"
          echo "::error::(the key that signed every previous release). Minting a new key here"
          echo "::error::would produce an APK that existing users could not install as an update."
          exit 1

      # The signing credentials are scoped to this one step. app/build.gradle.kts
      # reads them with System.getenv, and this invocation is what starts the
      # Gradle daemon, so the daemon inherits exactly this environment.
      - name: Assemble release APKs and run unit tests
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:testReleaseUnitTest --stacktrace

      # A failed unit test used to mean reading a four-thousand-line log to find
      # out which assertion went. The HTML report is right there; keep it.
      - name: Upload the unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # PLAY-PROTECT + OVER-INSTALL SAFEGUARD. Never publish an APK that is
      # unsigned, debug-signed, or signed by a different certificate than the
      # previous release: Android rejects such an update outright
      # (INSTALL_FAILED_UPDATE_INCOMPATIBLE) and users would have to uninstall
      # and lose their settings.
      - name: Verify release signature
        env:
          AETHER_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # apksigner lives in build-tools, which is not guaranteed to be
          # installed - and with nullglob set, an empty build-tools glob left
          # `ls -d` with no arguments, so the path silently became "." and this
          # entire gate died on "./apksigner: not found". Locate it properly, and
          # say so plainly when it is genuinely absent.
          APKSIGNER=""
          for d in $(printf '%s\n' "${ANDROID_SDK_ROOT}"/build-tools/*/ | sort -Vr); do
            if [ -x "${d}apksigner" ]; then APKSIGNER="${d}apksigner"; break; fi
          done
          [ -n "$APKSIGNER" ] || APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found - no Android build-tools on this runner."
            echo "::error::The release signature cannot be verified, so this build is not publishable."
            exit 1
          fi
          echo "Using ${APKSIGNER}"
          case "${AETHER_SIGNING_MODE:-ci}" in
            release) PIN=".github/expected-signer.txt" ;;
            *)       PIN=".github/expected-signer-ci.txt" ;;
          esac
          apks=(app/build/outputs/apk/release/*.apk)
          [ "${#apks[@]}" -gt 0 ] || { echo "::error::no release APKs to verify"; exit 1; }
          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose --print-certs "$apk" > /tmp/sig.txt
            grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/sig.txt \
              || { echo "::error::$apk has no APK Signature Scheme v2 signature"; exit 1; }
            if grep -qi "CN=Android Debug" /tmp/sig.txt; then
              echo "::error::$apk is debug-signed - refusing to publish"; exit 1
            fi
            # First 64-hex digest on any SHA-256 line, with a keytool fallback.
            # An empty fingerprint must never count as a match, or the whole
            # over-install guarantee silently becomes a no-op.
            SHA="$(tr -d '\r' < /tmp/sig.txt \
              | sed -n 's/.*SHA-256 digest:[[:space:]]*\([0-9a-fA-F]\{64\}\).*/\1/p' \
              | head -n1 | tr 'A-F' 'a-f')"
            if [ -z "$SHA" ]; then
              SHA="$(keytool -printcert -jarfile "$apk" 2>/dev/null | tr -d '\r' \
                | sed -n 's/.*SHA-\?256:[[:space:]]*\([0-9A-Fa-f:]\{95,\}\).*/\1/p' \
                | head -n1 | tr -d ':' | tr 'A-F' 'a-f')"
            fi
            printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{64}$' \
              || { echo "::error::could not read the signer fingerprint of $apk"; sed -n '1,40p' /tmp/sig.txt; exit 1; }
            if grep -Eq '^[0-9a-fA-F]{64}$' "$PIN" 2>/dev/null; then
              EXPECTED="$(grep -Eo '^[0-9a-fA-F]{64}$' "$PIN" | tr 'A-F' 'a-f' | head -n1)"
              if [ "$EXPECTED" != "$SHA" ]; then
                echo "::error::signer certificate changed - expected ${EXPECTED}, got ${SHA}."
                echo "::error::Existing users could NOT install this build as an update."
                exit 1
              fi
            else
              # Release mode with no pin file is the dangerous case: the
              # over-install guarantee is simply not being enforced. Make it
              # visible in the run summary instead of one grey log line.
              echo "::warning::no fingerprint pinned in ${PIN}; this build's signer is ${SHA}."
              echo "::warning::Commit it to ${PIN} to lock updatability in place."
              echo "- :warning: signer not pinned in \`${PIN}\` - this build's signer is \`${SHA}\`" \
                >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "OK  $(basename "$apk")  signer ${SHA}"
          done

      # Full VPN mode needs all three mandatory cores for every ABI in the APK,
      # and a release needs the two chain cores as well. Proxy mode alone would
      # still work, which is exactly why this is checked here instead of being
      # left to a user's bug report.
      - name: Verify native libraries inside the APKs
        env:
          IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          chain_missing=false
          for apk in app/build/outputs/apk/release/*.apk; do
            entries="$(unzip -Z1 "$apk")"
            mapfile -t abis < <(printf '%s\n' "$entries" | sed -n 's#^lib/\([^/]*\)/libaether\.so$#\1#p')
            [ "${#abis[@]}" -gt 0 ] || { echo "::error::no libaether.so in $apk"; exit 1; }
            for abi in "${abis[@]}"; do
              for lib in libhev-socks5-tunnel.so libaethertun.so; do
                printf '%s\n' "$entries" | grep -qx "lib/${abi}/${lib}" \
                  || { echo "::error::$(basename "$apk") lacks ${lib} for ${abi}"; exit 1; }
              done
              for lib in libpsiphon.so libtor.so; do
                if ! printf '%s\n' "$entries" | grep -qx "lib/${abi}/${lib}"; then
                  chain_missing=true
                  echo "::warning::$(basename "$apk") has no ${lib} for ${abi} (chain feature reduced)"
                fi
              done
            done
            # Psiphon's bootstrap list travels as an ASSET, not a native library,
            # so it needs its own check: an APK with libpsiphon.so and no server
            # entries offers a Psiphon mode that cannot establish a first tunnel.
            if printf '%s\n' "$entries" | grep -qx 'assets/psiphon/server_entries.txt'; then
              echo "OK  $(basename "$apk")  Psiphon bootstrap server list present"
            else
              chain_missing=true
              echo "::warning::$(basename "$apk") has no Psiphon bootstrap server list (Psiphon modes unavailable)"
            fi
            echo "OK  $(basename "$apk")  cores present for ${abis[*]}"
          done
          if [ "${chain_missing}" = true ] && [ "${IS_RELEASE_TAG}" = "true" ]; then
            echo "::error::a tagged release must not ship an APK without libpsiphon.so, libtor.so and the Psiphon server list"
            exit 1
          fi

      # The version comes from AGP's own output metadata, not from grepping
      # build.gradle.kts, so a stray comment mentioning versionName can no
      # longer rename every published artifact.
      - name: Collect and rename APKs
        id: collect
        run: |
          set -euo pipefail
          DIR="app/build/outputs/apk/release"
          META="${DIR}/output-metadata.json"
          [ -f "$META" ] || { echo "::error::${META} not found"; exit 1; }
          VERSION="$(jq -r '.elements[0].versionName' "$META")"
          [ -n "$VERSION" ] && [ "$VERSION" != "null" ] \
            || { echo "::error::could not read versionName from ${META}"; exit 1; }
          mkdir -p artifacts
          # An element with no filters is the universal APK. `.value` is what AGP
          # writes today and `.identifier` is what it used to write, so accept
          # either instead of quietly labelling everything "universal".
          jq -r '.elements[]
                 | [ ( ((.filters // []) | map(.value // .identifier) | map(select(. != null)) | join("-"))
                       | if . == "" then "universal" else . end ),
                     .outputFile ]
                 | @tsv' "$META" \
          | while IFS=$'\t' read -r abi file; do
              cp "${DIR}/${file}" "artifacts/Aether-${VERSION}-${abi}.apk"
            done
          expected="$(jq -r '.elements | length' "$META")"
          actual="$(find artifacts -name '*.apk' | wc -l)"
          [ "$expected" -eq "$actual" ] \
            || { echo "::error::${META} lists ${expected} outputs but ${actual} APKs were collected"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "### Aether v${VERSION}"
            echo '```'
            ls -la artifacts
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: aether-${{ steps.collect.outputs.version }}-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error

  # ================================================================ PUBLISH ==
  release:
    name: Publish release
    needs: app
    # Tags publish a real release. Pushes to the DEFAULT branch publish a
    # prerelease. Nothing else publishes at all, which is what keeps a
    # workflow_dispatch on an old feature branch from becoming the download
    # everybody sees.
    if: >-
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          name: aether-${{ needs.app.outputs.version }}-${{ github.run_number }}
          path: artifacts

      # Checked before anything can become "latest". The release action's file
      # matching does not fail by default, so a download that produced nothing
      # published an EMPTY release - and on a `v*` tag that empty release was
      # also marked latest, leaving the download page offering nothing at all.
      - name: Confirm there is something to publish
        run: |
          set -euo pipefail
          count="$(find artifacts -name '*.apk' | wc -l)"
          [ "$count" -gt 0 ] \
            || { echo "::error::no APKs were downloaded - refusing to publish an empty release"; exit 1; }
          echo "Publishing ${count} APK(s)."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build.{1}', needs.app.outputs.version, github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Aether {0}', github.ref_name) || format('Aether v{0}', needs.app.outputs.version) }}
          files: artifacts/*.apk
          # Defaults to false, i.e. "publish it anyway". See the step above.
          fail_on_unmatched_files: true
          body_path: .github/release-notes.md
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
